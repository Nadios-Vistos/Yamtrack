{% load i18n %}
{% url 'sosoblue:navigation' as navigation_url %}
<a href="{{ navigation_url }}"
   class="w-full flex items-center space-x-3 px-2 py-2 rounded-md transition-colors text-left border-l-2 cursor-pointer text-sm {% if request.path == navigation_url %}bg-[#39404b] text-white border-indigo-500{% else %}text-gray-400 border-transparent hover:bg-[#313842] hover:text-white{% endif %}">
  {% include "app/icons/hamburger.svg" with classes="w-5 h-5" %}
  <span>{% trans "Navigation" %}</span>
</a>
