{% load i18n sosoblue_tags %}
{% if user.is_authenticated %}
  {% navigation_tabs as tabs %}
  <nav class="sb-tabbar" aria-label="{% trans 'Main navigation' %}">
    {% for tab in tabs %}
      <a href="{{ tab.url }}" class="{% if tab.active %}sb-tab-on{% endif %}">
        {{ tab.svg }}
        <span>{{ tab.label }}</span>
      </a>
    {% endfor %}
    <button type="button" @click="isMobileMenuOpen = true">
      {% include "app/icons/hamburger.svg" with classes="" %}
      <span>{% trans "More" %}</span>
    </button>
  </nav>
{% endif %}
